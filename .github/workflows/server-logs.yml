# "Read server logs" button: prints the recent server-function logs so problems
# can be diagnosed. Read-only — it changes nothing. Run it from GitHub →
# Actions → "Read server logs" → Run workflow.
name: Read server logs

on:
  workflow_dispatch:
    inputs:
      lines:
        description: How many log lines to show
        default: '100'

jobs:
  logs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sign in to Google Cloud as the deploy account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Web addresses allowed to use "Sign in with Google" (Authentication → Settings →
      # Authorized domains). The live site and the preview must both be listed.
      - name: Web addresses allowed to sign in with Google
        continue-on-error: true
        run: |
          curl -sS -H "Authorization: Bearer $(gcloud auth print-access-token)" -H "x-goog-user-project: proptracker-9732e" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/proptracker-9732e/config" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("ERROR:", d["error"].get("message")) if "error" in d else [print("  -", x) for x in d.get("authorizedDomains", [])]'

      # Storage rules look up people's roles in Firestore; that needs this role on the
      # Storage service agent, or every upload by a non-owner is refused.
      - name: Can the photo-upload rules read people's roles?
        continue-on-error: true
        run: |
          NUM=$(gcloud projects describe proptracker-9732e --format='value(projectNumber)')
          SA="service-$NUM@gcp-sa-firebasestorage.iam.gserviceaccount.com"
          echo "Storage service agent: $SA"
          gcloud projects get-iam-policy proptracker-9732e --flatten='bindings[].members' \
            --filter="bindings.members:$SA" --format='value(bindings.role)' || true

      - name: Roles of the GitHub publishing accounts (website + backend)
        continue-on-error: true
        run: |
          for SA in $(gcloud iam service-accounts list --project proptracker-9732e --format='value(email)'); do
            echo "== $SA ($(gcloud iam service-accounts describe $SA --format='value(disabled)' | sed 's/True/DISABLED/;s/False/enabled/'))"
            gcloud projects get-iam-policy proptracker-9732e --flatten='bindings[].members' \
              --filter="bindings.members:serviceAccount:$SA" --format='value(bindings.role)' || true
            gcloud iam service-accounts keys list --iam-account=$SA --managed-by=user --format='value(name.basename(), validAfterTime, disabled)' 2>/dev/null | sed 's/^/   key /' || true
          done
          echo "== Recent changes to who has access (last 3 days)"
          gcloud logging read 'protoPayload.methodName="SetIamPolicy" OR protoPayload.methodName:"DeleteServiceAccountKey" OR protoPayload.methodName:"DisableServiceAccountKey"' \
            --project proptracker-9732e --freshness 3d --limit 20 \
            --format='value(timestamp, protoPayload.methodName, protoPayload.authenticationInfo.principalEmail)' || true

      - name: Who may call each function (needs allUsers for the app to reach it)
        continue-on-error: true
        run: |
          for f in analyzepropphoto searchsimilar rebuildsearchindex createreservation cancelreservation declinereservation setlinepick setbuildstate markpacked confirmpickup startreturn checkin sendtestemail checknoticesnow importinfo startimport processimport approveimports skipimports mergeimports deleteimportedprop undoimport findduplicates comparepropphotos mergeprops mergebins improvesearchwords savegearitem savegearbundle setgearbundlearchived creategearbooking cancelgearbooking declinegearbooking pickupgear returngear handovergear checkingear markgearfound makemissingthumbs bookshoot cancelshoot addscheduleblock removescheduleblock saveschedulesettings listschedulepeople moveshoot requestswap answerswap mycalendarlink testcalendarlink shootscalendar previewcalendarimport applycalendarimport checkinshoot wrapshoot explainmissedcheckin decideshoot reviewreport liftpause givestrike removestrike pausecreator reviewflag editreservation editgearbooking ideatoprops bookwithfriends answerinvite askfortime costreport cleanupphotos registerpush unregisterpush testpush testpushto listfilmingfriends calendarpending applycalendarchanges checkcalendarnow; do
            echo "== $f"; gcloud run services get-iam-policy "$f" --region northamerica-northeast1 --project proptracker-9732e --format='value(bindings)' || true
          done

      - name: Requests to the functions that failed (last 6 hours)
        continue-on-error: true
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND httpRequest.status>=400' \
            --project proptracker-9732e --freshness 6h --limit 40 \
            --format='table(timestamp, resource.labels.service_name, httpRequest.status, httpRequest.requestMethod)'

      - name: Everything logged around each failed request (last 24 hours, 20 s either side)
        continue-on-error: true
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND httpRequest.status>=500' \
            --project proptracker-9732e --freshness 24h --limit 8 \
            --format='value(timestamp, resource.labels.service_name)' | while read -r ts svc; do
            [ -z "$ts" ] && continue
            from=$(date -u -d "$ts - 20 seconds" +%Y-%m-%dT%H:%M:%SZ); to=$(date -u -d "$ts + 20 seconds" +%Y-%m-%dT%H:%M:%SZ)
            echo "=== $svc failed at $ts"
            gcloud logging read "resource.labels.service_name=\"$svc\" AND timestamp>=\"$from\" AND timestamp<=\"$to\"" \
              --project proptracker-9732e --limit 30 --order asc \
              --format='value(timestamp, severity, httpRequest.status, httpRequest.latency, textPayload, jsonPayload.message, jsonPayload.error, protoPayload.status.message)' | cut -c1-600
          done
      - name: Errors and warnings from inside the functions (last 6 hours)
        continue-on-error: true
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND severity>=WARNING AND NOT httpRequest:*' \
            --project proptracker-9732e --freshness 6h --limit "${{ inputs.lines }}" \
            --format='value(timestamp, resource.labels.service_name, textPayload, jsonPayload.message)'

      # Phone notifications (Oct 21): is Google's push service switched on, which phones are signed up
      # (count per person, no tokens printed), and what happened when pushes were sent.
      - name: "Notifications: is Firebase Cloud Messaging switched on?"
        continue-on-error: true
        run: |
          gcloud services list --enabled --project proptracker-9732e --format='value(config.name)' | grep -iE 'fcm|firebasecloudmessaging' || echo "NOT ENABLED: Firebase Cloud Messaging API (fcm.googleapis.com)"

      - name: "Notifications: phones signed up, per person"
        continue-on-error: true
        run: |
          curl -sS -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            "https://firestore.googleapis.com/v1/projects/proptracker-9732e/databases/(default)/documents/push_tokens?pageSize=300" \
            | python3 -c '
          import json,sys,collections
          d=json.load(sys.stdin)
          if "error" in d: print("ERROR:", d["error"].get("message")); sys.exit()
          c=collections.defaultdict(list)
          for doc in d.get("documents",[]):
              f=doc["fields"]; g=lambda k: f.get(k,{}).get("stringValue","")
              c[g("email")].append((g("platform"), g("lastSeen")[:16], len(g("token"))))
          for e,v in sorted(c.items()):
              print(e); [print("   ", p or "?", "· last seen", s, "· token length", n) for p,s,n in v]
          print(len(c), "people,", sum(len(v) for v in c.values()), "phones")'

      - name: "Notifications: what the push functions logged (last 3 days)"
        continue-on-error: true
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND (resource.labels.service_name=~"push" OR textPayload=~"Push" OR jsonPayload.message=~"Push")' \
            --project proptracker-9732e --freshness 3d --limit 80 \
            --format='value(timestamp, resource.labels.service_name, severity, textPayload, jsonPayload.message)'

      - name: "Notifications: the last 20 sends (who, how many phones, delivered, errors)"
        continue-on-error: true
        run: |
          curl -sS -X POST -H "Authorization: Bearer $(gcloud auth print-access-token)" -H "Content-Type: application/json" \
            "https://firestore.googleapis.com/v1/projects/proptracker-9732e/databases/(default)/documents:runQuery" \
            -d '{"structuredQuery":{"from":[{"collectionId":"push_log"}],"orderBy":[{"field":{"fieldPath":"at"},"direction":"DESCENDING"}],"limit":20}}' \
            | python3 -c '
          import json,sys
          for r in json.load(sys.stdin):
              d=r.get("document")
              if not d: continue
              f=d["fields"]; s=lambda k: f.get(k,{}).get("stringValue","")
              n=lambda k: f.get(k,{}).get("integerValue","0")
              to=[v.get("stringValue","") for v in f.get("to",{}).get("arrayValue",{}).get("values",[])]
              errs=[v.get("stringValue","") for v in f.get("errors",{}).get("arrayValue",{}).get("values",[])]
              print(s("at")[:19], "|", s("title")[:40], "| to", ",".join(to), "| phones", n("phones"), "| delivered to Google", n("sent"), "|", "; ".join(errs))'

      - name: "Data check: records that disagree with each other (read only)"
        continue-on-error: true
        run: T=$(gcloud auth print-access-token) python3 .github/scripts/data_check.py

      - name: "Launch readiness: live settings, people and gear (read only)"
        continue-on-error: true
        run: |
          T=$(gcloud auth print-access-token); B="https://firestore.googleapis.com/v1/projects/proptracker-9732e/databases/(default)/documents"
          get() { curl -sS -H "Authorization: Bearer $T" "$B/$1"; }
          echo "== Booking rules (app_settings/booking)"; get app_settings/booking | python3 -c '
          import json,sys; d=json.load(sys.stdin).get("fields",{})
          for k,v in sorted(d.items()): print("  ",k,"=",list(v.values())[0])'
          echo "== Schedule settings (app_settings/schedule)"; get app_settings/schedule | python3 -c '
          import json,sys; d=json.load(sys.stdin).get("fields",{})
          for k,v in sorted(d.items()):
              val=list(v.values())[0]
              if k=="priority": val=[x["mapValue"]["fields"].get("name",{}).get("stringValue","?") for x in val.get("values",[])]
              elif isinstance(val,dict): val=val.get("values", val)
              print("  ",k,"=",val)'
          echo "== Google Calendar check (app_settings/calendarCheck)"; get app_settings/calendarCheck | python3 -c '
          import json,sys; d=json.load(sys.stdin).get("fields",{}); print("  ", {k:list(v.values())[0] for k,v in d.items()} or "never ran")'
          echo "== People by role"; get "users?pageSize=300" | python3 -c '
          import json,sys,collections; c=collections.Counter(); names=collections.defaultdict(list)
          for doc in json.load(sys.stdin).get("documents",[]):
              f=doc["fields"]; r=f.get("role",{}).get("stringValue","?"); a=f.get("active",{}).get("booleanValue",False)
              c[(r,a)]+=1; names[r].append(f.get("name",{}).get("stringValue","") or doc["name"].split("/")[-1].split("@")[0])
          for (r,a),n in sorted(c.items()): print("  ",r,"active" if a else "inactive",n)
          for r,v in names.items(): print("  ",r,":",", ".join(sorted(v))[:300])'
          echo "== Gear"; get "gear_items?pageSize=300" | python3 -c '
          import json,sys; ds=json.load(sys.stdin).get("documents",[])
          pub=[d["fields"]["name"]["stringValue"] for d in ds if d["fields"].get("public",{}).get("booleanValue")]
          print("  ",len(ds),"pieces,",len(pub),"set to Creators can book:",", ".join(pub)[:300])'
          get "gear_bundles?pageSize=300" | python3 -c '
          import json,sys; ds=json.load(sys.stdin).get("documents",[])
          live=[d for d in ds if not d["fields"].get("archived",{}).get("booleanValue")]
          print("  ",len(live),"offers live:",", ".join(d["fields"]["name"]["stringValue"]+" ("+d["fields"].get("kind",{}).get("stringValue","bundle")+")" for d in live)[:400])'
          echo "== Company props"; curl -sS -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" "$B:runAggregationQuery" \
            -d '{"structuredAggregationQuery":{"structuredQuery":{"from":[{"collectionId":"items"}],"where":{"fieldFilter":{"field":{"fieldPath":"collection"},"op":"EQUAL","value":{"stringValue":"company"}}}},"aggregations":[{"count":{},"alias":"n"}]}}' \
            | python3 -c 'import json,sys; print("  ", json.load(sys.stdin)[0]["result"]["aggregateFields"]["n"]["integerValue"], "company props")'
          echo "== Shoots booked from today on"; curl -sS -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" "$B:runAggregationQuery" \
            -d "{\"structuredAggregationQuery\":{\"structuredQuery\":{\"from\":[{\"collectionId\":\"shoots\"}],\"where\":{\"fieldFilter\":{\"field\":{\"fieldPath\":\"date\"},\"op\":\"GREATER_THAN_OR_EQUAL\",\"value\":{\"stringValue\":\"$(TZ=America/Toronto date +%F)\"}}}},\"aggregations\":[{\"count\":{},\"alias\":\"n\"}]}}" \
            | python3 -c 'import json,sys; print("  ", json.load(sys.stdin)[0]["result"]["aggregateFields"]["n"]["integerValue"], "shoots (any status)")'
