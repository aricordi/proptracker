# "Copy sample props for screenshots" button: READ-ONLY. Prints the names, bins and photo links of a
# sample of Prime Capitol props (never personal props, never notes, costs or people) so the practice
# copy of the app can show real photos in demo screenshots. Changes nothing in the live app.
name: Copy sample props for screenshots

on:
  workflow_dispatch:
    inputs:
      count:
        description: How many props to copy
        default: '40'

jobs:
  sample:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Sign in to Google Cloud as the deploy account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sample props (read-only)
        env:
          COUNT: ${{ github.event.inputs.count }}
        run: |
          TOKEN=$(gcloud auth print-access-token)
          python3 - "$TOKEN" <<'PY'
          import json, os, random, sys, urllib.request
          token = sys.argv[1]
          base = 'https://firestore.googleapis.com/v1/projects/proptracker-9732e/databases/(default)/documents'
          def call(url, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body else None, method='POST' if body else 'GET',
                  headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'})
              return json.load(urllib.request.urlopen(req))
          def val(v):
              if v is None: return None
              k, x = next(iter(v.items()))
              if k == 'arrayValue': return [val(i) for i in x.get('values', [])]
              if k == 'mapValue': return {a: val(b) for a, b in x.get('fields', {}).items()}
              if k == 'integerValue': return int(x)
              return x
          q = {'structuredQuery': {'from': [{'collectionId': 'items'}],
               'where': {'fieldFilter': {'field': {'fieldPath': 'collection'}, 'op': 'EQUAL', 'value': {'stringValue': 'company'}}},
               'select': {'fields': [{'fieldPath': f} for f in ['name', 'categoryId', 'quantity', 'binId', 'photos', 'thumbs', 'archived', 'condition', 'description', 'tags']]},
               'limit': 2000}}
          rows = [r['document'] for r in call(base + ':runQuery', q) if 'document' in r]
          items = []
          for d in rows:
              f = {k: val(v) for k, v in d.get('fields', {}).items()}
              if f.get('archived') or not f.get('photos'): continue
              p = f['photos'][0]
              items.append({'name': f.get('name'), 'categoryId': f.get('categoryId'), 'quantity': f.get('quantity', 1),
                  'binId': f.get('binId'), 'condition': f.get('condition', 'good'), 'description': (f.get('description') or '')[:160],
                  'tags': f.get('tags') or [], 'photo': (f.get('thumbs') or {}).get(p) or p})
          random.seed(7); random.shuffle(items)
          pick = items[: int(os.environ.get('COUNT') or 40)]
          bins = {}
          for d in call(base + '/bins?pageSize=1000').get('documents', []):
              bins[d['name'].split('/')[-1]] = {k: val(v) for k, v in d.get('fields', {}).items()}.get('label')
          cats = {}
          for d in call(base + '/categories?pageSize=200').get('documents', []):
              cats[d['name'].split('/')[-1]] = {k: val(v) for k, v in d.get('fields', {}).items()}.get('label')
          tags = {}
          for d in call(base + '/tags?pageSize=1000').get('documents', []):
              tags[d['name'].split('/')[-1]] = {k: val(v) for k, v in d.get('fields', {}).items()}.get('label')
          for it in pick:
              it['bin'] = bins.get(it.pop('binId') or '', '')
              it['tags'] = [tags[t] for t in it['tags'] if t in tags][:6]
          print(f'{len(items)} company props with photos; copied {len(pick)}.')
          print('SAMPLE-START')
          print(json.dumps({'items': pick, 'categories': cats}))
          print('SAMPLE-END')
          PY
