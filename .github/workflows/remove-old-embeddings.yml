# "Remove old AI data from props" button (owner OK, Nov 2; go-live checklist item 6).
# Older props still carry an `embedding` field: 768 numbers from a retired AI model that nothing reads any more
# (smart search uses item_vectors). Every phone downloads it with the props list, which makes the app heavier.
# This removes ONLY that one field (field-level update), so nothing else on the prop changes (not even "last updated")
# and an edit someone makes at the same time is never overwritten. Daily backups + 7-day point-in-time undo are on.
# Mode "check" (default) only counts; "remove" does it. Run from GitHub → Actions.
name: Remove old AI data from props

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = only count, remove = remove the old field'
        type: choice
        options: [check, remove]
        default: check

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Sign in to Google Cloud as the deploy account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Find (and remove) the old field
        env:
          MODE: ${{ inputs.mode }}
        run: |
          TOKEN=$(gcloud auth print-access-token)
          python3 - "$TOKEN" <<'PY'
          import json, os, sys, urllib.request, urllib.error, urllib.parse
          token, mode = sys.argv[1], os.environ.get('MODE', 'check')
          base = 'https://firestore.googleapis.com/v1/projects/proptracker-9732e/databases/(default)/documents'
          H = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          def call(url, method='GET', body=None):
              req = urllib.request.Request(url, method=method, headers=H, data=json.dumps(body).encode() if body is not None else None)
              with urllib.request.urlopen(req) as r: return json.loads(r.read() or b'{}')
          found, total, page = [], 0, ''
          while True:
              # Only the `embedding` field is downloaded (mask), so this is light.
              url = f'{base}/items?pageSize=300&mask.fieldPaths=embedding' + (f'&pageToken={urllib.parse.quote(page)}' if page else '')
              res = call(url)
              for d in res.get('documents', []):
                  total += 1
                  if 'embedding' in d.get('fields', {}): found.append(d['name'])
              page = res.get('nextPageToken')
              if not page: break
          print(f'Props checked: {total}. With the old AI field: {len(found)}.')
          if mode != 'remove':
              print('Check only: nothing was changed. Run again with mode "remove" to remove it.'); sys.exit(0)
          removed = skipped = 0
          for name in found:
              doc = name.split('/documents/')[1]
              # updateMask=embedding with no value = remove just that one field; exists=true = never creates a prop.
              url = f'{base}/{doc}?updateMask.fieldPaths=embedding&currentDocument.exists=true'
              try:
                  call(url, 'PATCH', {'fields': {}}); removed += 1
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  if e.code in (400, 404, 409) and ('NOT_FOUND' in body or 'FAILED_PRECONDITION' in body): skipped += 1; print('gone, skipped:', doc)
                  else: print('FAILED', doc, e.code, body[:300]); sys.exit(1)
          print(f'Removed the old field from {removed} props. Skipped {skipped}. Run "check" again: it should say 0.')
          PY
