# "Deploy backend" button: publishes the server functions, Firestore security
# rules + indexes, and Storage rules to the LIVE Firebase project.
# It never runs on its own — only when someone clicks "Run workflow" on GitHub
# (Actions tab → Deploy backend), and only after every test passes.
#
# Does NOT change the live website itself (hosting); that's a separate step.
#
# Needs the GitHub secret FIREBASE_DEPLOY_SERVICE_ACCOUNT (JSON key of the
# github-deploy service account) and the GEMINI_API_KEY secret to already
# exist in Google Cloud Secret Manager.
name: Deploy backend

on:
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firebase emulator (used by the tests) needs Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Keep Google's emulator download between runs (faster, and avoids
      # failures when Google's download server has a hiccup).
      - name: Reuse the Firebase emulator download
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - name: Install
        run: |
          npm ci
          npm ci --prefix functions

      - name: Run all tests first (nothing is deployed if any fail)
        run: npm test

      - name: Sign in to Google Cloud as the deploy account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      # Delete old function build images after 7 days so they don't slowly add
      # storage costs. Safe to run every time; fails harmlessly before the
      # very first functions deploy creates the image storage.
      - name: Keep function build storage tidy
        continue-on-error: true
        run: npx firebase functions:artifacts:setpolicy --location northamerica-northeast1 --days 7 --project proptracker-9732e --force --non-interactive

      # Google's build service occasionally fails a function build for no
      # reason of ours (especially on a new project), so try once more.
      - name: Deploy server functions, security rules and indexes
        run: |
          deploy() { npx firebase deploy --only functions,firestore,storage --project proptracker-9732e --non-interactive; }
          deploy || { echo "First attempt failed; waiting 60s and retrying once..."; sleep 60; deploy; }

      - uses: google-github-actions/setup-gcloud@v2

      # Let the app reach every callable function. Firebase's deploy tool can
      # skip this on updates, which left functions answering "401 not allowed".
      # Safe: each function still checks the caller's sign-in and role itself.
      - name: Make sure the app can reach every function
        run: |
          for svc in analyzepropphoto searchsimilar rebuildsearchindex createreservation cancelreservation \
                     declinereservation setlinepick setbuildstate markpacked confirmpickup startreturn checkin \
                     sendtestemail checknoticesnow \
                     importinfo startimport processimport approveimports skipimports mergeimports deleteimportedprop undoimport findduplicates comparepropphotos mergeprops mergebins improvesearchwords savegearitem savegearbundle setgearbundlearchived creategearbooking cancelgearbooking declinegearbooking pickupgear returngear handovergear checkingear markgearfound makemissingthumbs bookshoot cancelshoot addscheduleblock removescheduleblock saveschedulesettings listschedulepeople moveshoot requestswap answerswap mycalendarlink testcalendarlink shootscalendar previewcalendarimport applycalendarimport checkinshoot wrapshoot explainmissedcheckin decideshoot reviewreport liftpause givestrike removestrike pausecreator reviewflag editreservation editgearbooking ideatoprops bookwithfriends answerinvite askfortime costreport cleanupphotos registerpush unregisterpush testpush testpushto listfilmingfriends calendarpending applycalendarchanges checkcalendarnow; do
            gcloud run services add-iam-policy-binding "$svc" --region northamerica-northeast1 \
              --project proptracker-9732e --member=allUsers --role=roles/run.invoker --quiet >/dev/null
            echo "✔ $svc"
          done
