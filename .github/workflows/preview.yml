# Automatic previews: every push to a branch other than main runs the tests,
# builds the app and publishes it to a Firebase Hosting *preview channel*
# (a separate, temporary web address). The live site is never touched.
#
# Note: a preview uses the REAL database and the server functions/rules that
# are currently live. Looking around is safe; edits made there are real edits.
#
# Needs these GitHub repository secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT        the JSON key for the deploy service account
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#   VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID
name: Preview

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  test-and-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      # Until the deploy key is added, only the tests run.
      CAN_PUBLISH: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firebase emulator (used by the tests) needs Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          npm ci
          npm ci --prefix functions

      - name: Run all tests (security rules, server functions, search logic)
        run: npm test

      - name: Build the app
        if: env.CAN_PUBLISH == 'true'
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Publish to preview channel
        if: env.CAN_PUBLISH == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: proptracker-9732e
          channelId: preview
          expires: 30d
